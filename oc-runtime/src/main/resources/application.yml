spring:
  application:
    name: opencrawling

  datasource:
    url: jdbc:h2:mem:opencrawling;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis_password

  ai:
    # ── Copilot engine: 'ollama' (default) or 'openai'
    # Set spring.ai.copilot.engine=openai and provide spring.ai.openai.api-key
    # to switch the narrativization copilot to OpenAI.
    copilot:
      engine: ollama
    # OpenAI autoconfiguration is OFF by default — no API key required.
    # Override with spring.ai.openai.enabled=true + spring.ai.openai.api-key=sk-...
    openai:
      enabled: false
      api-key: ${OPENAI_API_KEY:disabled}
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: ${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        options:
          model: mxbai-embed-large
    vectorstore:
      pgvector:
        url: jdbc:postgresql://127.0.0.1:5432/opencrawling
        username: opencrawling
        password: opencrawling_password
        driver-class-name: org.postgresql.Driver
        initialize-schema: true
        dimensions: 1024
    mcp:
      server:
        name: "opencrawling-secure-vector-mcp"
        version: "1.0.0"
        protocol: ${SPRING_AI_MCP_SERVER_PROTOCOL:STREAMABLE}
        transport: STREAMABLE_HTTP
        annotation-scanner:
          enabled: true

  batch:
    jdbc:
      initialize-schema: always

  threads:
    virtual:
      enabled: true

  opencrawling:
    claim-check:
      store: ${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:local}
      cleanup-on-consume: true
      local:
        dir: ${SPRING_OPENCRAWLING_CLAIM_CHECK_LOCAL_DIR:target/claims}
      ozone:
        s3-endpoint: ${SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT:http://localhost:9878}
        volume: ${SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_VOLUME:s3v}
        bucket: ${SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET:claims}
        access-key: ${OZONE_ACCESS_KEY_ID:ozone}
        secret-key: ${OZONE_SECRET_ACCESS_KEY:ozone-secret}
        path-style-access: true
        region: us-east-1
        auto-create-bucket: true
    reporting:
      enabled: ${SPRING_OPENCRAWLING_REPORTING_ENABLED:true}
      storage:
        type: ${SPRING_OPENCRAWLING_REPORTING_STORAGE_TYPE:LOCAL}
        local-dir: ${SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR:target/reports}
        s3:
          endpoint: ${SPRING_OPENCRAWLING_REPORTING_S3_ENDPOINT:http://localhost:9878}
          bucket: ${SPRING_OPENCRAWLING_REPORTING_S3_BUCKET:opencrawling-audit-reports}
          region: ${SPRING_OPENCRAWLING_REPORTING_S3_REGION:us-east-1}
          path-style-access: true
      formats:
        parquet:
          enabled: true
          compression: ZSTD
          row-group-size-bytes: 134217728
          page-size-bytes: 1048576
        avro: false
        csv: true
        json: true

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: opencrawling-vector-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.opencrawling.core.messaging"
    listener:
      observation-enabled: ${OPENCRAWLING_OBSERVABILITY_ENABLED:true}
    template:
      observation-enabled: ${OPENCRAWLING_OBSERVABILITY_ENABLED:true}

  grpc:
    server:
      port: 9095
    client:
      channel:
        internal:
          target: "static://127.0.0.1:9095"

opencrawling:
  transport:
    mode: AUTO # Options: AUTO, GRPC, REST
    grpc:
      enabled: true
      port: 9095
      max-message-size: 33554432
      fallback-to-rest: true
      keep-alive-time-ms: 30000
  connector:
    grpc-push:
      enabled: ${OPENCRAWLING_GRPC_PUSH_ENABLED:true}
      port: ${OPENCRAWLING_GRPC_PUSH_PORT:9096}
      max-message-size-mb: ${OPENCRAWLING_GRPC_PUSH_MAX_MESSAGE_MB:64}
      inline-binary-threshold-kb: 512
      token: ${OPENCRAWLING_GRPC_PUSH_TOKEN:}
      tls:
        enabled: ${OPENCRAWLING_GRPC_PUSH_TLS_ENABLED:false}
        cert-chain-path: ""
        private-key-path: ""
        trust-cert-path: ""
        client-auth: ${OPENCRAWLING_GRPC_PUSH_TLS_CLIENT_AUTH:NONE}
      reflection:
        enabled: true
  jobs:
    # Job runs at the same time in this runtime (job API); further starts get 429. 0 = no cap.
    max-concurrent-runs: ${OPENCRAWLING_JOBS_MAX_CONCURRENT_RUNS:0}
    # Runs one verified caller (jwt mode with protect-api) may hold at the same time; further starts get 429.
    # Runs started without a verified caller only count towards max-concurrent-runs. 0 = no cap.
    max-concurrent-runs-per-caller: ${OPENCRAWLING_JOBS_MAX_CONCURRENT_RUNS_PER_CALLER:0}
  ingest:
    ois:
      # Bearer token for POST /api/v1/ingest/ois/{jobId}; the endpoint is disabled while it is empty
      token: ${OPENCRAWLING_INGEST_OIS_TOKEN:}
  security:
    identity:
      # none (default): MCP tools use the identity asserted in their userPrincipal/userRoles arguments.
      # jwt: the MCP endpoints need a valid bearer token and tools use the token's identity, ignoring those
      # arguments. Point spring.security.oauth2.resourceserver.jwt.issuer-uri (or jwk-set-uri) at the identity
      # provider and set spring.security.oauth2.resourceserver.jwt.audiences.
      mode: ${OPENCRAWLING_SECURITY_IDENTITY_MODE:none}
      # jwt mode only: also require a token on /api/** (except OIS ingest, which has its own token).
      protect-api: ${OPENCRAWLING_SECURITY_IDENTITY_PROTECT_API:false}
      jwt:
        # The first non-blank claim is the caller's user identity.
        principal-claims: ${OPENCRAWLING_SECURITY_IDENTITY_JWT_PRINCIPAL_CLAIMS:preferred_username,sub}
        # Values of all these claims are the caller's groups/roles; dots name nested claims.
        group-claims: ${OPENCRAWLING_SECURITY_IDENTITY_JWT_GROUP_CLAIMS:realm_access.roles,groups}
        tenant-claim: ${OPENCRAWLING_SECURITY_IDENTITY_JWT_TENANT_CLAIM:}
    authorization:
      # metadata (default): the ACLs stored with each document decide.
      # shadow: metadata decides, OpenFGA is asked too and disagreements are logged.
      # intersection: both must allow. openfga: OpenFGA decides alone.
      mode: ${OPENCRAWLING_SECURITY_AUTHORIZATION_MODE:metadata}
      # In intersection/openfga modes stores skip their stored-ACL pre-filters and fetch
      # limit x overfetch-factor candidates (never more than candidate-budget) for the gate to check.
      overfetch-factor: 10
      candidate-budget: 500
      openfga:
        api-url: ${OPENCRAWLING_SECURITY_AUTHORIZATION_OPENFGA_API_URL:http://localhost:8080}
        # Pin both in production; auto-provision creates/reuses the store and model (development and tests).
        store-id: ${OPENCRAWLING_SECURITY_AUTHORIZATION_OPENFGA_STORE_ID:}
        model-id: ${OPENCRAWLING_SECURITY_AUTHORIZATION_OPENFGA_MODEL_ID:}
        auto-provision: ${OPENCRAWLING_SECURITY_AUTHORIZATION_OPENFGA_AUTO_PROVISION:false}
        api-token: ${OPENCRAWLING_SECURITY_AUTHORIZATION_OPENFGA_API_TOKEN:}
        timeout: 5s
        batch-size: 50
        sync:
          # Mirrors document permissions into OpenFGA from the documents topic (its own consumer group).
          enabled: ${OPENCRAWLING_SECURITY_AUTHORIZATION_OPENFGA_SYNC_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    enabled: ${OPENCRAWLING_OBSERVABILITY_ENABLED:true}
    sampling:
      probability: ${OPENCRAWLING_OBSERVABILITY_SAMPLING_PROBABILITY:1.0}

server:
  port: 8080

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    version: OPENAPI_3_1
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false

logging:
  level:
    root: INFO
    org.opencrawling: DEBUG
    org.springframework: INFO
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR
    org.apache.kafka: WARN
    org.hibernate: WARN
