services:
  solr:
    image: solr:9.8.0
    container_name: solr-standalone
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/var/solr
    command:
      - solr-precreate
      - enterprise_kb
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8983/solr/admin/info/system | grep -q solr || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  solr-data:
    name: solr-data
