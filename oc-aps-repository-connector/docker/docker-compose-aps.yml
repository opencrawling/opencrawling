services:
  aps:
    image: alfresco/process-services:26.2.0
    container_name: opencrawling-aps-it
    ports:
      - "${APS_PORT:-8088}:8080"
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres-aps
      - DB_PORT=5432
      - DB_NAME=activiti
      - DB_USERNAME=activiti
      - DB_PASSWORD=activiti
    depends_on:
      postgres-aps:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u ${APS_USERNAME:-admin@app.activiti.com}:${APS_PASSWORD:-admin} http://localhost:8080/activiti-app/api/enterprise/profile || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  postgres-aps:
    image: postgres:16-alpine
    container_name: opencrawling-postgres-aps-it
    environment:
      POSTGRES_DB: activiti
      POSTGRES_USER: activiti
      POSTGRES_PASSWORD: activiti
    ports:
      - "${APS_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activiti -d activiti"]
      interval: 5s
      timeout: 3s
      retries: 5
