services:
  # --- Infrastructure Services ---
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector-decoupled-s3
    environment:
      POSTGRES_USER: opencrawling
      POSTGRES_PASSWORD: opencrawling_password
      POSTGRES_DB: opencrawling
    ports:
      - "5432:5432"
    volumes:
      - opencrawling-pgdata-s3:/var/lib/postgresql/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrawling"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack-decoupled-s3
    environment:
      REDIS_ARGS: "--requirepass redis_password"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - opencrawling-redisdata-s3:/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-decoupled-s3
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9094,EXTERNAL://127.0.0.1:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9092:9092"
    volumes:
      - opencrawling-kafkadata-s3:/var/lib/kafka/data
    networks:
      - opencrawling-network

  # --- Target S3 Storage & Claim Check (MinIO S3 Compatible Object Store) ---
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio-decoupled-s3
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - opencrawling-miniodata-s3:/minio_data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Decoupled OpenCrawling Services in Migration Mode ---
  oc-crawler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.crawler
    image: ghcr.io/opencrawling/oc-crawler:latest
    container_name: oc-crawler-service-s3
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      # Parallel claim-check upload + Kafka publish lanes (per-document order preserved); 1 = sequential
      - SPRING_OPENCRAWLING_CRAWLER_CONCURRENCY=${OC_CRAWLER_CONCURRENCY:-4}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=true
      - SPRING_OPENCRAWLING_SCAN_PATH=/crawl
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=s3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-s3}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=S3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://minio:9000
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_REGION=us-east-1
      # Parallel multipart upload for large claim-check objects
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_MULTIPART_THRESHOLD=${OC_MULTIPART_THRESHOLD:-64MB}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_MULTIPART_PART_SIZE=${OC_MULTIPART_PART_SIZE:-16MB}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_MULTIPART_CONCURRENCY=${OC_MULTIPART_CONCURRENCY:-4}
      # Output S3 Configuration
      - SPRING_OPENCRAWLING_OUTPUT_S3_BUCKET=enterprise-migration-lake
      - SPRING_OPENCRAWLING_OUTPUT_S3_REGION=us-east-1
      - SPRING_OPENCRAWLING_OUTPUT_S3_ENDPOINT_OVERRIDE=http://minio:9000
      - SPRING_OPENCRAWLING_OUTPUT_S3_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_OUTPUT_S3_CREDENTIALS_STRATEGY=STATIC
      - SPRING_OPENCRAWLING_OUTPUT_S3_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_OUTPUT_S3_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_OUTPUT_S3_KEY_STRATEGY=HIERARCHICAL
      - SPRING_OPENCRAWLING_OUTPUT_S3_KEY_PREFIX=migration/v1/
      - SPRING_OPENCRAWLING_OUTPUT_S3_STORAGE_CLASS=STANDARD
      - SPRING_OPENCRAWLING_OUTPUT_S3_SERVER_SIDE_ENCRYPTION=NONE
      - SPRING_OPENCRAWLING_OUTPUT_S3_AUTO_CREATE_BUCKET=true
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - OPENCRAWLING_TIKA_FORK_ENABLED=false
      - SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR=/data/reports
    volumes:
      # Runtime state (settings, connectors, jobs) stays in /data and is NOT crawled.
      - ../../oc-runtime/data:/data
      # Dedicated crawl source: only the documents to migrate.
      - ${OC_CRAWL_SOURCE_DIR:-../../oc-runtime/crawl-data/s3-migration}:/crawl
      - opencrawling-reportsdata-s3:/data/reports
    depends_on:
      - kafka
      - redis
      - minio
    networks:
      - opencrawling-network
    restart: "no"

  oc-ingestion-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.ingestion-consumer
    image: ghcr.io/opencrawling/oc-ingestion-consumer:latest
    container_name: oc-ingestion-consumer-service-s3
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=s3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-s3}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=S3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://minio:9000
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_REGION=us-east-1
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=true
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
    volumes:
      - ../../oc-runtime/data:/data
    depends_on:
      - kafka
      - redis
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-writer-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.writer-consumer
    image: ghcr.io/opencrawling/oc-writer-consumer:latest
    container_name: oc-writer-service-s3
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=s3
      # Target AWS S3 / MinIO Configuration
      - SPRING_OPENCRAWLING_OUTPUT_S3_BUCKET=enterprise-migration-lake
      - SPRING_OPENCRAWLING_OUTPUT_S3_REGION=us-east-1
      - SPRING_OPENCRAWLING_OUTPUT_S3_ENDPOINT_OVERRIDE=http://minio:9000
      - SPRING_OPENCRAWLING_OUTPUT_S3_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_OUTPUT_S3_CREDENTIALS_STRATEGY=STATIC
      - SPRING_OPENCRAWLING_OUTPUT_S3_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_OUTPUT_S3_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_OUTPUT_S3_KEY_STRATEGY=HIERARCHICAL
      - SPRING_OPENCRAWLING_OUTPUT_S3_KEY_PREFIX=migration/v1/
      - SPRING_OPENCRAWLING_OUTPUT_S3_STORAGE_CLASS=STANDARD
      - SPRING_OPENCRAWLING_OUTPUT_S3_SERVER_SIDE_ENCRYPTION=NONE
      - SPRING_OPENCRAWLING_OUTPUT_S3_AUTO_CREATE_BUCKET=true
      - SPRING_OPENCRAWLING_OUTPUT_S3_CONSUMER_GROUP=opencrawling-s3-migration-group
      - SPRING_OPENCRAWLING_OUTPUT_S3_CONSUMER_CONCURRENCY=${S3_WRITER_CONCURRENCY:-3}
      # Parallel multipart upload for large binaries
      - SPRING_OPENCRAWLING_OUTPUT_S3_MULTIPART_THRESHOLD=${OC_MULTIPART_THRESHOLD:-64MB}
      - SPRING_OPENCRAWLING_OUTPUT_S3_MULTIPART_PART_SIZE=${OC_MULTIPART_PART_SIZE:-16MB}
      - SPRING_OPENCRAWLING_OUTPUT_S3_MULTIPART_CONCURRENCY=${OC_MULTIPART_CONCURRENCY:-4}
      # Claim Check store configuration (using MinIO S3)
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-s3}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=S3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://minio:9000
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_REGION=us-east-1
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=true
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
    volumes:
      - ../../oc-runtime/data:/data
    depends_on:
      - kafka
      - redis
      - minio
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-mcp-server:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.mcp-server
    image: ghcr.io/opencrawling/oc-mcp-server:latest
    container_name: oc-mcp-server-service-s3
    ports:
      - "8080:8080"
      - "9095:9095"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_AI_MCP_SERVER_PROTOCOL=${SPRING_AI_MCP_SERVER_PROTOCOL:-STREAMABLE}
      - SPRING_AI_MCP_SERVER_ANNOTATION_SCANNER_ENABLED=true
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=s3
      - SPRING_OPENCRAWLING_OUTPUT_S3_BUCKET=enterprise-migration-lake
      - SPRING_OPENCRAWLING_OUTPUT_S3_REGION=us-east-1
      - SPRING_OPENCRAWLING_OUTPUT_S3_ENDPOINT_OVERRIDE=http://minio:9000
      - SPRING_OPENCRAWLING_OUTPUT_S3_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_OUTPUT_S3_CREDENTIALS_STRATEGY=STATIC
      - SPRING_OPENCRAWLING_OUTPUT_S3_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_OUTPUT_S3_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR=/data/reports
    volumes:
      - ../../oc-runtime/data:/app/data
      - opencrawling-reportsdata-s3:/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      opencrawling-network:
        aliases:
          - opencrawling-backend
    restart: unless-stopped

networks:
  opencrawling-network:
    name: opencrawling-network-s3
    driver: bridge

volumes:
  opencrawling-pgdata-s3:
    name: opencrawling-pgdata-s3
  opencrawling-redisdata-s3:
    name: opencrawling-redisdata-s3
  opencrawling-kafkadata-s3:
    name: opencrawling-kafkadata-s3
  opencrawling-miniodata-s3:
    name: opencrawling-miniodata-s3
  opencrawling-reportsdata-s3:
    name: opencrawling-reportsdata-s3
