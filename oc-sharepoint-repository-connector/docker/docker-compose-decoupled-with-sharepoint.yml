services:
  # --- Microsoft Entra ID + Microsoft Graph emulator (Graph mock): there is no SharePoint Online container ---
  graph-mock:
    build:
      context: ../graph-mock
    image: opencrawling/graph-mock:local
    container_name: graph-mock-decoupled-sharepoint
    environment:
      - GRAPH_PORT=8080
      - GRAPH_FILE_COUNT=${GRAPH_FILE_COUNT:-40}
      - GRAPH_QUIET=true
    ports:
      - "8091:8080"
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/mock/stats', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Vector Store (PostgreSQL / pgvector) ---
  postgres-vector:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector-decoupled-sharepoint
    environment:
      POSTGRES_DB: opencrawling
      POSTGRES_USER: opencrawling
      POSTGRES_PASSWORD: opencrawling_password
    ports:
      - "5432:5432"
    volumes:
      - opencrawling-pgdata-sharepoint:/var/lib/postgresql/data
    networks:
      opencrawling-network:
        aliases:
          - postgres
          - postgres-vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrawling -d opencrawling"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack-decoupled-sharepoint
    environment:
      REDIS_ARGS: "--requirepass redis_password"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - opencrawling-redisdata-sharepoint:/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.5
    container_name: ollama-decoupled-sharepoint
    ports:
      - "11434:11434"
    volumes:
      - opencrawling-ollamadata:/root/.ollama
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-model-puller:
    image: ollama/ollama:0.40.5
    container_name: ollama-model-puller-decoupled-sharepoint
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to become responsive..."
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done
        echo "Pulling mxbai-embed-large embedding model..."
        ollama pull mxbai-embed-large
        echo "Embedding model pulled successfully."
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-decoupled-sharepoint
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: '4L62EnnTQKyNxTIfHfN8QA'
    volumes:
      - opencrawling-kafkadata-sharepoint:/var/lib/kafka/data
    networks:
      - opencrawling-network

  # --- Decoupled OpenCrawling Services ---
  # The crawler reads the Graph mock by default. To crawl a real SharePoint Online site instead, set SHAREPOINT_TENANT_ID,
  # SHAREPOINT_CLIENT_ID, SHAREPOINT_CLIENT_SECRET and SHAREPOINT_SITE_URL, and point SHAREPOINT_AUTHORITY_URL /
  # SHAREPOINT_GRAPH_URL at https://login.microsoftonline.com and https://graph.microsoft.com/v1.0 (their defaults when
  # the mock is not used). Optional: SHAREPOINT_DRIVE_NAMES, SHAREPOINT_CRAWL_MODE, SHAREPOINT_MAX_DOCUMENTS,
  # SHAREPOINT_FALLBACK_PRINCIPALS, SHAREPOINT_EVERYONE_EXCEPT_EXTERNAL_IDENTITY.
  oc-crawler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.crawler
    image: ghcr.io/opencrawling/oc-crawler:latest
    container_name: oc-crawler-service-sharepoint
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_OPENCRAWLING_REPOSITORY_CONNECTOR_TYPE=sharepoint
      - SPRING_OPENCRAWLING_CONNECTOR_TYPE=sharepoint
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_TENANT_ID=${SHAREPOINT_TENANT_ID:-contoso-tenant}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID:-opencrawling-test-app}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET:-test-secret}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_AUTHORITY_URL=${SHAREPOINT_AUTHORITY_URL:-http://graph-mock:8080}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_GRAPH_URL=${SHAREPOINT_GRAPH_URL:-http://graph-mock:8080/v1.0}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_SITE_URL=${SHAREPOINT_SITE_URL:-https://contoso.sharepoint.com/sites/engineering}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_DRIVE_NAMES=${SHAREPOINT_DRIVE_NAMES:-}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_CRAWL_MODE=${SHAREPOINT_CRAWL_MODE:-delta}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_MAX_DOCUMENTS=${SHAREPOINT_MAX_DOCUMENTS:-0}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_FALLBACK_PRINCIPALS=${SHAREPOINT_FALLBACK_PRINCIPALS:-}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_EVERYONE_EXCEPT_EXTERNAL_IDENTITY=${SHAREPOINT_EVERYONE_EXCEPT_EXTERNAL_IDENTITY:-}
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_INCREMENTAL=true
      - SPRING_OPENCRAWLING_CONNECTOR_SHAREPOINT_STATE_DIRECTORY=/data/sharepoint-state
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=true
      - SPRING_OPENCRAWLING_SCAN_PATH=default
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL=mxbai-embed-large
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=local
      - SPRING_OPENCRAWLING_CLAIM_CHECK_LOCAL_DIR=/data/claims
      - SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR=/data/reports
    volumes:
      - opencrawling-claims-sharepoint:/data/claims
      - opencrawling-reportsdata-sharepoint:/data/reports
      - opencrawling-state-sharepoint:/data/sharepoint-state
    depends_on:
      kafka:
        condition: service_started
      graph-mock:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: "no"

  oc-ingestion-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.ingestion-consumer
    image: ghcr.io/opencrawling/oc-ingestion-consumer:latest
    container_name: oc-ingestion-consumer-service-sharepoint
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=true
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=local
      - SPRING_OPENCRAWLING_CLAIM_CHECK_LOCAL_DIR=/data/claims
      - OPENCRAWLING_TIKA_FORK_ENABLED=true
      - OPENCRAWLING_TIKA_TIMEOUT_MS=30000
      - OPENCRAWLING_TIKA_JVM_ARGS=-Xmx512m
      - OPENCRAWLING_TIKA_MAX_FILES_PER_PROCESS=100000
    volumes:
      - opencrawling-claims-sharepoint:/data/claims
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-embedding-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.embedding-consumer
    image: ghcr.io/opencrawling/oc-embedding-consumer:latest
    container_name: oc-embedding-consumer-service-sharepoint
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=true
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL=mxbai-embed-large
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-model-puller:
        condition: service_completed_successfully
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-writer-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.writer-consumer
    image: ghcr.io/opencrawling/oc-writer-consumer:latest
    container_name: oc-writer-consumer-service-sharepoint
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=true
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS=1024
      - SPRING_AI_VECTORSTORE_PGVECTOR_TABLE_NAME=vector_store_1024
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-mcp-server:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.mcp-server
    image: ghcr.io/opencrawling/oc-mcp-server:latest
    container_name: oc-mcp-server-service-sharepoint
    ports:
      - "8080:8080"
      - "9095:9095"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_MCP_SERVER_PROTOCOL=${SPRING_AI_MCP_SERVER_PROTOCOL:-STREAMABLE}
      - SPRING_AI_MCP_SERVER_ANNOTATION_SCANNER_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS=1024
      - SPRING_AI_VECTORSTORE_PGVECTOR_TABLE_NAME=vector_store_1024
      - SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR=/data/reports
    volumes:
      - opencrawling-reportsdata-sharepoint:/data/reports
    depends_on:
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      opencrawling-network:
        aliases:
          - opencrawling-backend
    restart: unless-stopped

networks:
  opencrawling-network:
    name: opencrawling-network
    driver: bridge

volumes:
  opencrawling-pgdata-sharepoint:
    name: opencrawling-pgdata-sharepoint
  opencrawling-redisdata-sharepoint:
    name: opencrawling-redisdata-sharepoint
  opencrawling-ollamadata:
    name: opencrawling-ollamadata
  opencrawling-kafkadata-sharepoint:
    name: opencrawling-kafkadata-sharepoint
  opencrawling-claims-sharepoint:
    name: opencrawling-claims-sharepoint
  opencrawling-reportsdata-sharepoint:
    name: opencrawling-reportsdata-sharepoint
  opencrawling-state-sharepoint:
    name: opencrawling-state-sharepoint

