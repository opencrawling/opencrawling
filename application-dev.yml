spring:
  application:
    name: opencrawling

  datasource:
    url: jdbc:h2:mem:opencrawling;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis_password

  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      embedding:
        options:
          model: mxbai-embed-large
    vectorstore:
      pgvector:
        url: jdbc:postgresql://127.0.0.1:5432/opencrawling
        username: opencrawling
        password: opencrawling_password
        driver-class-name: org.postgresql.Driver
        initialize-schema: true
        dimensions: 1024

  batch:
    jdbc:
      initialize-schema: always

  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: opencrawling-vector-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.opencrawling.core.messaging"

  grpc:
    server:
      port: 9095
    client:
      channel:
        internal:
          target: "static://127.0.0.1:9095"

opencrawling:
  connector:
    grpc-push:
      enabled: ${OPENCRAWLING_GRPC_PUSH_ENABLED:true}
      port: ${OPENCRAWLING_GRPC_PUSH_PORT:9096}
      max-message-size-mb: ${OPENCRAWLING_GRPC_PUSH_MAX_MESSAGE_MB:64}
      inline-binary-threshold-kb: 512
      token: ${OPENCRAWLING_GRPC_PUSH_TOKEN:}
      tls:
        enabled: ${OPENCRAWLING_GRPC_PUSH_TLS_ENABLED:false}
        cert-chain-path: ""
        private-key-path: ""
        trust-cert-path: ""
        client-auth: ${OPENCRAWLING_GRPC_PUSH_TLS_CLIENT_AUTH:NONE}
      reflection:
        enabled: true
  transport:
    mode: AUTO # Options: AUTO, GRPC, REST
    grpc:
      enabled: true
      port: 9095
      max-message-size: 33554432
      fallback-to-rest: true
      keep-alive-time-ms: 30000

server:
  port: 8080

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    version: OPENAPI_3_1
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false

