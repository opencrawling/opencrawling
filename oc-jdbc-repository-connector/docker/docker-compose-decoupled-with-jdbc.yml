services:
  # --- JDBC Target Relational Database (Source Repository) ---
  postgres-jdbc-source:
    image: postgres:17-alpine
    container_name: postgres-jdbc-source-decoupled
    environment:
      POSTGRES_DB: enterprise_db
      POSTGRES_USER: jdbc_user
      POSTGRES_PASSWORD: jdbc_password
    ports:
      - "5433:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - opencrawling-jdbc-sourcedata:/var/lib/postgresql/data
    networks:
      opencrawling-network:
        aliases:
          - postgres-jdbc-source
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdbc_user -d enterprise_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Vector Store (PostgreSQL / pgvector) ---
  postgres-vector:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector-decoupled-jdbc
    environment:
      POSTGRES_DB: opencrawling
      POSTGRES_USER: opencrawling
      POSTGRES_PASSWORD: opencrawling_password
    ports:
      - "5432:5432"
    volumes:
      - opencrawling-pgdata-jdbc:/var/lib/postgresql/data
    networks:
      opencrawling-network:
        aliases:
          - postgres
          - postgres-vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrawling -d opencrawling"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack-decoupled-jdbc
    environment:
      REDIS_ARGS: "--requirepass redis_password"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - opencrawling-redisdata-jdbc:/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.23.4
    container_name: ollama-decoupled-jdbc
    ports:
      - "11434:11434"
    volumes:
      - opencrawling-ollamadata:/root/.ollama
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama-model-puller:
    image: ollama/ollama:0.23.4
    container_name: ollama-model-puller-decoupled-jdbc
    entrypoint: ["/bin/sh", "-c", "ollama pull mxbai-embed-large && ollama pull nomic-embed-text"]
    environment:
      - OLLAMA_HOST=ollama:11434
    networks:
      - opencrawling-network
    depends_on:
      ollama:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-decoupled-jdbc
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9094,EXTERNAL://127.0.0.1:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9092:9092"
    volumes:
      - opencrawling-kafkadata-jdbc:/var/lib/kafka/data
    networks:
      - opencrawling-network

  # --- Decoupled OpenCrawling Services ---
  oc-crawler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.crawler
    image: ghcr.io/opencrawling/oc-crawler:latest
    container_name: oc-crawler-service-jdbc
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_OPENCRAWLING_REPOSITORY_CONNECTOR_TYPE=jdbc
      - OPENCRAWLING_CONNECTOR_TYPE=jdbc
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_ENABLED=true
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_URL=jdbc:postgresql://postgres-jdbc-source:5432/enterprise_db
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_USERNAME=jdbc_user
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_PASSWORD=jdbc_password
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_TABLE_NAME=kb_articles
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_ID_COLUMN=id
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_TITLE_COLUMN=title
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_PRIMARY_KEY_COLUMNS=id
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_SOFT_DELETE_ENABLED=true
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_SOFT_DELETE_COLUMN=is_deleted
      - SPRING_OPENCRAWLING_CONNECTOR_JDBC_SOFT_DELETE_VALUE=true
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=true
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
    depends_on:
      kafka:
        condition: service_started
      postgres-jdbc-source:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: on-failure

  oc-ingestion-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.ingestion-consumer
    image: ghcr.io/opencrawling/oc-ingestion-consumer:latest
    container_name: oc-ingestion-consumer-service-jdbc
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - OPENCRAWLING_TIKA_FORK_ENABLED=true
      - OPENCRAWLING_TIKA_TIMEOUT_MS=30000
      - OPENCRAWLING_TIKA_JVM_ARGS=-Xmx512m
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-embedding-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.embedding-consumer
    image: ghcr.io/opencrawling/oc-embedding-consumer:latest
    container_name: oc-embedding-consumer-service-jdbc
    ports:
      - "8082:8082"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
    depends_on:
      kafka:
        condition: service_started
      ollama:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-writer-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.writer-consumer
    image: ghcr.io/opencrawling/oc-writer-consumer:latest
    container_name: oc-writer-service-jdbc
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-mcp-server:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.mcp-server
    image: ghcr.io/opencrawling/oc-mcp-server:latest
    container_name: oc-mcp-server-service-jdbc
    ports:
      - "8080:8080"
      - "9095:9095"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
    depends_on:
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      opencrawling-network:
        aliases:
          - opencrawling-backend
    restart: unless-stopped

networks:
  opencrawling-network:
    name: opencrawling-network
    driver: bridge

volumes:
  opencrawling-jdbc-sourcedata:
    name: opencrawling-jdbc-sourcedata
  opencrawling-pgdata-jdbc:
    name: opencrawling-pgdata-jdbc
  opencrawling-redisdata-jdbc:
    name: opencrawling-redisdata-jdbc
  opencrawling-ollamadata:
    name: opencrawling-ollamadata
  opencrawling-kafkadata-jdbc:
    name: opencrawling-kafkadata-jdbc
