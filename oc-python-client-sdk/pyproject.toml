[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "opencrawling-sdk"
version = "1.0.5.dev0"
description = "Official Python Client SDK for the OpenCrawling Platform API v1, OIS Direct Ingestion, gRPC Push Streaming, and Enterprise OAuth 2.0 / RFC 8693 Multi-Agent Identity."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Piergiorgio Lucidi", email = "piergiorgio@apache.org" },
]
keywords = [
    "opencrawling",
    "rag",
    "ois",
    "open-ingestion-standard",
    "crawling",
    "ai-agents",
    "mcp",
    "lakehouse",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
http2 = [
    "h2>=4.1.0",
]
grpc = [
    "grpcio>=1.68.0",
    "protobuf>=5.28.0",
]
dataframe = [
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://opencrawling.org"
Documentation = "https://github.com/opencrawling/opencrawling/wiki/Python-Client-SDK"
Repository = "https://github.com/opencrawling/opencrawling"
Issues = "https://github.com/opencrawling/opencrawling/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opencrawling"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: integration tests requiring a live OpenCrawling runtime (set OPENCRAWLING_BASE_URL)",
]
