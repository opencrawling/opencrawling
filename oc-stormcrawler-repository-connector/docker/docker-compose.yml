services:
  zookeeper:
    image: zookeeper:3.9
    container_name: storm-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181 && exec 3<&- && exec 3>&-' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  nimbus:
    image: storm:3.1.0
    container_name: storm-nimbus
    hostname: nimbus
    command: storm nimbus
    ports:
      - "6627:6627"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6627 && exec 3<&- && exec 3>&-' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  supervisor:
    image: storm:3.1.0
    container_name: storm-supervisor
    command: storm supervisor
    depends_on:
      nimbus:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  ui:
    image: storm:3.1.0
    container_name: storm-ui
    command: storm ui
    ports:
      - "8088:8080"
    depends_on:
      nimbus:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3<&- && exec 3>&-' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
