# Local development override for docker-compose-decoupled-with-filenet.yml: the OpenCrawling services are built from
# docker/local/Dockerfile.* (BuildKit Maven cache mounts, see the wiki page "Local Development and Docker Builds").
#
# Usage:
#   docker compose -f oc-filenet-repository-connector/docker/docker-compose-decoupled-with-filenet.yml \
#                  -f oc-filenet-repository-connector/docker/docker-compose-decoupled-with-filenet.local.yml build

services:
  oc-crawler:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile.crawler

  oc-ingestion-consumer:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile.ingestion-consumer

  oc-embedding-consumer:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile.embedding-consumer

  oc-writer-consumer:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile.writer-consumer

  oc-mcp-server:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile.mcp-server
