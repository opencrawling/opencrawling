# The shape of a document in every search; appended to each operation that uses it.
fragment DocumentFields on Document {
  id
  name
  className
  mimeType
  contentSize
  creator
  dateCreated
  lastModifier
  dateLastModified
  majorVersionNumber
  minorVersionNumber
  isCurrentVersion
  versionStatus
  updateSequenceNumber
  versionSeries { id }
  contentElements {
    elementSequenceNumber
    contentType
    ... on ContentTransfer { retrievalName contentSize downloadUrl }
    ... on ContentReference { contentLocation }
  }
  foldersFiledIn @include(if: $withFolders) {
    folders { pathName }
    pageInfo { token }
  }
  permissions @include(if: $withAcls) {
    ... on AccessPermission { granteeName granteeType accessType accessMask permissionSource }
  }
  properties @include(if: $withProperties) { id type cardinality value }
  # ActiveMarkings, asked for by name: a document with markings is left out unless marked-documents is 'index'
  markings: properties(includes: ["ActiveMarkings"]) @include(if: $withMarkings) {
    id
    ... on ObjectListProperty { objectListValue { className } }
  }
}
