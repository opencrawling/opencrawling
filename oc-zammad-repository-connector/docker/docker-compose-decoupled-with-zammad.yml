# Decoupled OpenCrawling pipeline paired with a real Zammad Helpdesk & Knowledge Base
# instance derived from https://github.com/zammad/zammad-docker-compose (trimmed to the
# core services needed for REST API v1 + Elasticsearch search: zammad-postgresql,
# zammad-redis, zammad-memcached, zammad-elasticsearch, zammad-init, zammad-railsserver).

x-zammad-env: &zammad-env
  MEMCACHE_SERVERS: zammad-memcached:11211
  POSTGRESQL_DB: zammad_production
  POSTGRESQL_HOST: zammad-postgresql
  POSTGRESQL_USER: zammad
  POSTGRESQL_PASS: zammad
  POSTGRESQL_PORT: 5432
  POSTGRESQL_OPTIONS: "?pool=25"
  POSTGRESQL_DB_CREATE: "false"
  REDIS_URL: redis://zammad-redis:6379
  ELASTICSEARCH_ENABLED: "true"
  ELASTICSEARCH_SCHEMA: http
  ELASTICSEARCH_HOST: zammad-elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_NAMESPACE: zammad
  TZ: UTC

services:
  # --- Real Zammad Stack (derived from zammad/zammad-docker-compose) ---
  zammad-elasticsearch:
    image: elasticsearch:${ZAMMAD_ELASTICSEARCH_VERSION:-9.5.5}
    container_name: zammad-elasticsearch-decoupled-zammad
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ZAMMAD_ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - opencrawling-zammad-esdata:/usr/share/elasticsearch/data
    networks:
      opencrawling-network:
        aliases:
          - zammad-elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  zammad-memcached:
    image: memcached:${ZAMMAD_MEMCACHE_VERSION:-1.6.45-alpine}
    container_name: zammad-memcached-decoupled-zammad
    command: memcached -m 128M
    networks:
      opencrawling-network:
        aliases:
          - zammad-memcached
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 5s
      timeout: 3s
      retries: 10

  zammad-redis:
    image: redis:${ZAMMAD_REDIS_VERSION:-8.10.3-alpine}
    container_name: zammad-redis-decoupled-zammad
    volumes:
      - opencrawling-zammad-redisdata:/data
    networks:
      opencrawling-network:
        aliases:
          - zammad-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zammad-postgresql:
    image: postgres:${ZAMMAD_POSTGRES_VERSION:-17.12-alpine}
    container_name: zammad-postgresql-decoupled-zammad
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zammad_super_password
      POSTGRES_DB: postgres
    volumes:
      - opencrawling-zammad-pgdata:/var/lib/postgresql/data
    configs:
      - source: zammad-postgresql-initdb
        target: /docker-entrypoint-initdb.d/10-create-zammad-role.sql
    networks:
      opencrawling-network:
        aliases:
          - zammad-postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=zammad
          psql --no-password --quiet --output /dev/null --variable ON_ERROR_STOP=1
          --host 127.0.0.1 --username zammad --dbname zammad_production --command "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 15

  zammad-init:
    image: ${ZAMMAD_IMAGE_REPO:-ghcr.io/zammad/zammad}:${ZAMMAD_VERSION:-7.2.3-0008}
    container_name: zammad-init-decoupled-zammad
    command: ["zammad-init"]
    init: true
    user: 0:0
    environment:
      <<: *zammad-env
    volumes:
      - opencrawling-zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy
      zammad-elasticsearch:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: "no"

  zammad-railsserver:
    image: ${ZAMMAD_IMAGE_REPO:-ghcr.io/zammad/zammad}:${ZAMMAD_VERSION:-7.2.3-0008}
    container_name: zammad-railsserver-decoupled-zammad
    command: ["zammad-railsserver"]
    init: true
    ports:
      - "${ZAMMAD_PORT:-8094}:3000"
    environment:
      <<: *zammad-env
      ZAMMAD_WEB_CONCURRENCY: ${ZAMMAD_WEB_CONCURRENCY:-1}
    volumes:
      - opencrawling-zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      opencrawling-network:
        aliases:
          - zammad
          - zammad-railsserver
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  # --- Vector Store (PostgreSQL / pgvector) ---
  postgres-vector:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector-decoupled-zammad
    environment:
      POSTGRES_DB: opencrawling
      POSTGRES_USER: opencrawling
      POSTGRES_PASSWORD: opencrawling_password
    ports:
      - "5432:5432"
    volumes:
      - opencrawling-pgdata-zammad:/var/lib/postgresql/data
    networks:
      opencrawling-network:
        aliases:
          - postgres
          - postgres-vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrawling -d opencrawling"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack-decoupled-zammad
    environment:
      REDIS_ARGS: "--requirepass redis_password"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - opencrawling-redisdata-zammad:/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.5
    container_name: ollama-decoupled-zammad
    ports:
      - "11434:11434"
    volumes:
      - opencrawling-ollamadata:/root/.ollama
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-model-puller:
    image: ollama/ollama:0.40.5
    container_name: ollama-model-puller-decoupled-zammad
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to become responsive..."
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done
        echo "Pulling mxbai-embed-large embedding model..."
        ollama pull mxbai-embed-large
        echo "Embedding model pulled successfully."
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-decoupled-zammad
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: '4L62EnnTQKyNxTIfHfN8QA'
    volumes:
      - opencrawling-kafkadata-zammad:/var/lib/kafka/data
    networks:
      - opencrawling-network

  # --- Decoupled OpenCrawling Services ---
  # Connects to the bundled real Zammad instance by default (http://zammad-railsserver:3000).
  # Override ZAMMAD_URL, ZAMMAD_AUTH_TYPE, and ZAMMAD_ACCESS_TOKEN (or ZAMMAD_USERNAME /
  # ZAMMAD_PASSWORD) to crawl an external Zammad server instead.
  oc-crawler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.crawler
    image: ghcr.io/opencrawling/oc-crawler:${OC_IMAGE_TAG:-latest}
    container_name: oc-crawler-service-zammad
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_OPENCRAWLING_REPOSITORY_CONNECTOR_TYPE=zammad
      - SPRING_OPENCRAWLING_CONNECTOR_TYPE=zammad
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_BASE_URL=${ZAMMAD_URL:-http://zammad-railsserver:3000}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_AUTH_TYPE=${ZAMMAD_AUTH_TYPE:-token}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_ACCESS_TOKEN=${ZAMMAD_ACCESS_TOKEN:-}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_USERNAME=${ZAMMAD_USERNAME:-}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_PASSWORD=${ZAMMAD_PASSWORD:-}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_ON_BEHALF_OF=${ZAMMAD_ON_BEHALF_OF:-}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_GROUP_NAMES=${ZAMMAD_GROUP_NAMES:-}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_TICKET_STATES=${ZAMMAD_TICKET_STATES:-}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_TICKETS=${ZAMMAD_INCLUDE_TICKETS:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_INTERNAL_ARTICLES=${ZAMMAD_INCLUDE_INTERNAL_ARTICLES:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_ARTICLE_GRANULARITY=${ZAMMAD_ARTICLE_GRANULARITY:-SPLIT_PUBLIC_AND_INTERNAL}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_ATTACHMENTS=${ZAMMAD_INCLUDE_ATTACHMENTS:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_KNOWLEDGE_BASE=${ZAMMAD_INCLUDE_KNOWLEDGE_BASE:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_TAGS=${ZAMMAD_INCLUDE_TAGS:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_CRAWL_MODE=${ZAMMAD_CRAWL_MODE:-search_delta}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_STATE_FILE=/data/zammad-state
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_MAX_ATTACHMENT_SIZE_BYTES=${ZAMMAD_MAX_ATTACHMENT_SIZE_BYTES:-52428800}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_ACLS=${ZAMMAD_INCLUDE_ACLS:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_CUSTOMER_IN_PUBLIC_ACL=${ZAMMAD_INCLUDE_CUSTOMER_IN_PUBLIC_ACL:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INCLUDE_SHARED_ORGANIZATION_IN_PUBLIC_ACL=${ZAMMAD_INCLUDE_SHARED_ORGANIZATION_IN_PUBLIC_ACL:-true}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_ALLOW_PUBLIC_KB=${ZAMMAD_ALLOW_PUBLIC_KB:-false}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_PAGE_SIZE=${ZAMMAD_PAGE_SIZE:-50}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_PARALLELISM=${ZAMMAD_PARALLELISM:-4}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_MAX_RETRIES=${ZAMMAD_MAX_RETRIES:-5}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_INITIAL_BACKOFF_MS=${ZAMMAD_INITIAL_BACKOFF_MS:-200}
      - SPRING_OPENCRAWLING_CONNECTOR_ZAMMAD_TIMEOUT_SECONDS=${ZAMMAD_TIMEOUT_SECONDS:-30}
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=true
      - SPRING_OPENCRAWLING_SCAN_PATH=default
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL=mxbai-embed-large
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=local
      - SPRING_OPENCRAWLING_CLAIM_CHECK_LOCAL_DIR=/data/claims
      - SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR=/data/reports
    volumes:
      - opencrawling-claims-zammad:/data/claims
      - opencrawling-reportsdata-zammad:/data/reports
      - opencrawling-state-zammad:/data/zammad-state
    depends_on:
      kafka:
        condition: service_started
      zammad-railsserver:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: "no"

  oc-ingestion-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.ingestion-consumer
    image: ghcr.io/opencrawling/oc-ingestion-consumer:${OC_IMAGE_TAG:-latest}
    container_name: oc-ingestion-consumer-service-zammad
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=true
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=local
      - SPRING_OPENCRAWLING_CLAIM_CHECK_LOCAL_DIR=/data/claims
      - OPENCRAWLING_TIKA_FORK_ENABLED=true
      - OPENCRAWLING_TIKA_TIMEOUT_MS=30000
      - OPENCRAWLING_TIKA_JVM_ARGS=-Xmx512m
    volumes:
      - opencrawling-claims-zammad:/data/claims
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-embedding-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.embedding-consumer
    image: ghcr.io/opencrawling/oc-embedding-consumer:${OC_IMAGE_TAG:-latest}
    container_name: oc-embedding-consumer-service-zammad
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=true
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL=mxbai-embed-large
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-model-puller:
        condition: service_completed_successfully
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-writer-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.writer-consumer
    image: ghcr.io/opencrawling/oc-writer-consumer:${OC_IMAGE_TAG:-latest}
    container_name: oc-writer-consumer-service-zammad
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=true
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS=1024
      - SPRING_AI_VECTORSTORE_PGVECTOR_TABLE_NAME=vector_store_1024
    depends_on:
      kafka:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-mcp-server:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.mcp-server
    image: ghcr.io/opencrawling/oc-mcp-server:${OC_IMAGE_TAG:-latest}
    container_name: oc-mcp-server-service-zammad
    ports:
      - "${MCP_PORT:-8080}:8080"
      - "9095:9095"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_MCP_SERVER_PROTOCOL=${SPRING_AI_MCP_SERVER_PROTOCOL:-STREAMABLE}
      - SPRING_AI_MCP_SERVER_ANNOTATION_SCANNER_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_URL=jdbc:postgresql://postgres-vector:5432/opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_USERNAME=opencrawling
      - SPRING_AI_VECTORSTORE_PGVECTOR_PASSWORD=opencrawling_password
      - SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS=1024
      - SPRING_AI_VECTORSTORE_PGVECTOR_TABLE_NAME=vector_store_1024
      - SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR=/data/reports
    volumes:
      - opencrawling-reportsdata-zammad:/data/reports
    depends_on:
      postgres-vector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      opencrawling-network:
        aliases:
          - opencrawling-backend
    restart: unless-stopped

configs:
  zammad-postgresql-initdb:
    content: |
      CREATE ROLE zammad LOGIN PASSWORD 'zammad';
      CREATE DATABASE zammad_production OWNER zammad;

networks:
  opencrawling-network:
    name: opencrawling-network
    driver: bridge

volumes:
  opencrawling-zammad-pgdata:
    name: opencrawling-zammad-pgdata
  opencrawling-zammad-redisdata:
    name: opencrawling-zammad-redisdata
  opencrawling-zammad-esdata:
    name: opencrawling-zammad-esdata
  opencrawling-zammad-storage:
    name: opencrawling-zammad-storage
  opencrawling-pgdata-zammad:
    name: opencrawling-pgdata-zammad
  opencrawling-redisdata-zammad:
    name: opencrawling-redisdata-zammad
  opencrawling-ollamadata:
    name: opencrawling-ollamadata
  opencrawling-kafkadata-zammad:
    name: opencrawling-kafkadata-zammad
  opencrawling-claims-zammad:
    name: opencrawling-claims-zammad
  opencrawling-reportsdata-zammad:
    name: opencrawling-reportsdata-zammad
  opencrawling-state-zammad:
    name: opencrawling-state-zammad
