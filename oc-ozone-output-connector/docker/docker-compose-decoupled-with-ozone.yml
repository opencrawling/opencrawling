services:
  # --- Infrastructure Services ---
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector-decoupled-ozone
    environment:
      POSTGRES_USER: opencrawling
      POSTGRES_PASSWORD: opencrawling_password
      POSTGRES_DB: opencrawling
    ports:
      - "5432:5432"
    volumes:
      - opencrawling-pgdata-ozone:/var/lib/postgresql/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrawling"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack-decoupled-ozone
    environment:
      REDIS_ARGS: "--requirepass redis_password"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - opencrawling-redisdata-ozone:/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-decoupled-ozone
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9094,EXTERNAL://127.0.0.1:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9092:9092"
    volumes:
      - opencrawling-kafkadata-ozone:/var/lib/kafka/data
    networks:
      - opencrawling-network

  # --- Primary Apache Ozone (Source Claim Check Store) ---
  ozone-scm:
    image: apache/ozone:2.2.0
    container_name: ozone-scm-source
    hostname: scm
    environment:
      OZONE-SITE.XML_ozone.scm.client.address: scm
      OZONE-SITE.XML_ozone.scm.names: scm
      OZONE-SITE.XML_ozone.om.address: om
      # Single-datanode dev cluster: relax production safe-mode rules (3 datanodes / Ratis THREE pipeline)
      # and default to replication factor 1, otherwise SCM never leaves safe mode and writes hang.
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: "1"
      OZONE-SITE.XML_hdds.scm.safemode.pipeline-availability.check: "false"
      OZONE-SITE.XML_ozone.server.default.replication: "1"
      OZONE-SITE.XML_ozone.replication: "1"
      # Default is 5m: SCM would not create write pipelines until 5 minutes after leaving safe mode.
      OZONE-SITE.XML_hdds.scm.wait.time.after.safemode.exit: "5s"
      # Default 120s: create the RATIS/ONE write pipeline shortly after startup.
      OZONE-SITE.XML_ozone.scm.pipeline.creation.interval: "10s"
      # Dev sizing: defaults (5GB pre-allocated containers + 20GB reserved free space per volume)
      # exhaust a typical Docker Desktop disk, so SCM fails with "Unable to allocate a container".
      OZONE-SITE.XML_ozone.scm.container.size: "1GB"
      OZONE-SITE.XML_ozone.scm.block.size: "64MB"
      OZONE-SITE.XML_hdds.datanode.volume.min.free.space: "1GB"
      OZONE-SITE.XML_ozone.metadata.dirs: /data/metadata
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      OZONE_OPTS: "-Xmx256m"
    command: ["ozone", "scm"]
    networks:
      - opencrawling-network

  ozone-om:
