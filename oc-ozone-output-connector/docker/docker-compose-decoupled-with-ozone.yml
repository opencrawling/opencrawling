  # --- Decoupled OpenCrawling Services in Migration Mode ---
  oc-crawler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.crawler
    image: ghcr.io/opencrawling/oc-crawler:latest
    container_name: oc-crawler-service-ozone
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      # Parallel claim-check upload + Kafka publish lanes (per-document order preserved); 1 = sequential
      - SPRING_OPENCRAWLING_CRAWLER_CONCURRENCY=${OC_CRAWLER_CONCURRENCY:-4}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=true
      - SPRING_OPENCRAWLING_SCAN_PATH=/crawl
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=ozone
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-ozone}
      # NATIVE (default, Ozone RPC to the source OM + datanodes) or S3 (source S3 Gateway HTTP)
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=${SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE:-NATIVE}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_OM_HOST=om
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_OM_PORT=9862
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://s3g:9878
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      # Parallel multipart upload for large claim-check objects (S3 client)
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_MULTIPART_THRESHOLD=${OC_MULTIPART_THRESHOLD:-256MB}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_MULTIPART_PART_SIZE=${OC_MULTIPART_PART_SIZE:-16MB}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_MULTIPART_CONCURRENCY=${OC_MULTIPART_CONCURRENCY:-4}
      # NATIVE (Ozone RPC to the OM + Ratis gRPC to datanodes, default) or S3G (S3 Gateway HTTP)
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_CLIENT_TYPE=${SPRING_OPENCRAWLING_OUTPUT_OZONE_CLIENT_TYPE:-NATIVE}
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_OM_HOST=target-om
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_OM_PORT=9862
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_S3_ENDPOINT=http://target-s3g:9878
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_VOLUME=s3v
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_BUCKET=migration-target
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - OPENCRAWLING_TIKA_FORK_ENABLED=false
    volumes:
      # Runtime state (settings, connectors, jobs) stays in /data and is NOT crawled.
      - ../../oc-runtime/data:/data
      # Dedicated crawl source: only the documents to migrate.
      - ${OC_CRAWL_SOURCE_DIR:-../../oc-runtime/crawl-data/ozone-migration}:/crawl
    depends_on:
      - kafka
      - redis
      - ozone-s3g
    networks:
      - opencrawling-network
    restart: "no"

  oc-ingestion-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.ingestion-consumer
    image: ghcr.io/opencrawling/oc-ingestion-consumer:latest
    container_name: oc-ingestion-consumer-service-ozone
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=ozone
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-ozone}
      # NATIVE (default, Ozone RPC to the source OM + datanodes) or S3 (source S3 Gateway HTTP)
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=${SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE:-NATIVE}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_OM_HOST=om
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_OM_PORT=9862
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://s3g:9878
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=true
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
    volumes:
      - ../../oc-runtime/data:/data
    depends_on:
      - kafka
      - redis
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-writer-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.writer-consumer
    image: ghcr.io/opencrawling/oc-writer-consumer:latest
    container_name: oc-writer-service-ozone
