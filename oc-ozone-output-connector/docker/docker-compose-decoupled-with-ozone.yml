      - SPRING_OPENCRAWLING_OUTPUT_OZONE_CLIENT_TYPE=${SPRING_OPENCRAWLING_OUTPUT_OZONE_CLIENT_TYPE:-NATIVE}
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_OM_HOST=target-om
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_OM_PORT=9862
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_S3_ENDPOINT=http://target-s3g:9878
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_VOLUME=s3v
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_BUCKET=migration-target
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-ozone}
      # NATIVE (default, Ozone RPC to the source OM + datanodes) or S3 (source S3 Gateway HTTP)
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=${SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE:-NATIVE}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_OM_HOST=om
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_OM_PORT=9862
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://s3g:9878
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=true
      # Parallel migration threads; effective parallelism = min(this, OC_KAFKA_PARTITIONS)
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_CONSUMER_CONCURRENCY=${OZONE_WRITER_CONCURRENCY:-3}
      # Parallel multipart upload for large binaries (S3G client only; NATIVE streams blocks directly)
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_MULTIPART_THRESHOLD=${OC_MULTIPART_THRESHOLD:-256MB}
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_MULTIPART_PART_SIZE=${OC_MULTIPART_PART_SIZE:-16MB}
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_MULTIPART_CONCURRENCY=${OC_MULTIPART_CONCURRENCY:-4}
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
    volumes:
      - ../../oc-runtime/data:/data
    depends_on:
      - kafka
      - redis
      - ozone-s3g
      - target-ozone-s3g
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-mcp-server:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.mcp-server
    image: ghcr.io/opencrawling/oc-mcp-server:latest
    container_name: oc-mcp-server-service-ozone
    ports:
      - "8080:8080"
      - "9095:9095"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/opencrawling
      - SPRING_DATASOURCE_USERNAME=opencrawling
      - SPRING_DATASOURCE_PASSWORD=opencrawling_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=ozone
      # NATIVE (Ozone RPC to the OM + Ratis gRPC to datanodes, default) or S3G (S3 Gateway HTTP)
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_CLIENT_TYPE=${SPRING_OPENCRAWLING_OUTPUT_OZONE_CLIENT_TYPE:-NATIVE}
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_OM_HOST=target-om
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_OM_PORT=9862
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_S3_ENDPOINT=http://target-s3g:9878
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_VOLUME=s3v
      - SPRING_OPENCRAWLING_OUTPUT_OZONE_BUCKET=migration-target
    volumes:
      - ../../oc-runtime/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      opencrawling-network:
        aliases:
          - opencrawling-backend
    restart: unless-stopped

networks:
  opencrawling-network:
    name: opencrawling-network-ozone
    driver: bridge

volumes:
  opencrawling-pgdata-ozone:
    name: opencrawling-pgdata-ozone
  opencrawling-redisdata-ozone:
    name: opencrawling-redisdata-ozone
  opencrawling-kafkadata-ozone:
    name: opencrawling-kafkadata-ozone
