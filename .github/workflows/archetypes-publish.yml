name: Publish Maven Archetypes to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version for archetypes (e.g. 1.0.4)'
        type: string
        required: false
        default: '1.0.4'

permissions: read-all

jobs:
  publish-archetypes:
    name: Build & Publish Connector Archetypes
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set Release Version (if specified)
        run: |
          RELEASE_VER="${{ inputs.release_version }}"
          if [ -n "$RELEASE_VER" ]; then
            CURRENT_VER=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "Setting release version from $CURRENT_VER to $RELEASE_VER"
            mvn versions:set -B -DnewVersion=$RELEASE_VER -DgenerateBackupPoms=false
            cd oc-connector-archetypes
            mvn versions:set -B -DnewVersion=$RELEASE_VER -DprocessParents=true -DgenerateBackupPoms=false
            sed -i "s/<version>${CURRENT_VER}<\/version>/<version>${RELEASE_VER}<\/version>/g" \
              opencrawling-archetype-*/src/main/resources/archetype-resources/pom.xml
            cd ..
          fi

      - name: Build Core Dependencies
        run: |
          mvn clean install -DskipTests -pl oc-core,oc-observability -am

      - name: Deploy Archetypes via Sonatype Central Publishing Plugin
        run: |
          cd oc-connector-archetypes
          mvn clean deploy -DskipTests \
            -Dgpg.skip=false \
            -Dgpg.passphrase="${{ secrets.MAVEN_GPG_PASSPHRASE }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
