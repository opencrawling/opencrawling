name: Dependency & Vulnerability Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review & Vulnerability Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review Action
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-on-pr: true

  dependabot-metadata:
    name: Dependabot PR Metadata & Check
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Comment PR Info
        run: |
          gh pr comment "$PR_URL" --body "Dependabot update detected (${{ steps.metadata.outputs.dependency-names }}) - Update type: ${{ steps.metadata.outputs.update-type }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
