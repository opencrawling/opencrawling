name: Continuous Integration & Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions: read-all

jobs:
  backend-ci:
    name: Java 25 & Spring Boot 4 Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Unit & Integration Tests
        run: |
          mvn clean verify -DfailIfNoTests=false

  frontend-ci:
    name: Admin UI React 19 Frontend Build & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: oc-admin-ui/package-lock.json

      - name: Install dependencies & run frontend build
        run: |
          cd oc-admin-ui
          npm ci
          npm run build

  archetypes-ci:
    name: Connector Archetypes Suite Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Archetypes
        run: |
          mvn clean test-compile -pl oc-connector-archetypes -am
