name: Publish Java SDK to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version for oc-java-client-sdk (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions: read-all

jobs:
  publish-sdk:
    name: Build & Publish Java Client SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set Release Version (if specified)
        run: |
          RELEASE_VER="${{ inputs.release_version }}"
          if [ -n "$RELEASE_VER" ]; then
            echo "Setting release version to $RELEASE_VER"
            cd oc-java-client-sdk
            mvn versions:set -DnewVersion=$RELEASE_VER -DgenerateBackupPoms=false
            cd ..
          fi

      - name: Build Core Dependencies
        run: |
          mvn clean install -DskipTests -pl oc-core -am

      - name: Deploy Java Client SDK via Sonatype Central Publishing Plugin
        run: |
          cd oc-java-client-sdk
          mvn clean deploy -DskipTests \
            -Dgpg.skip=false \
            -Dgpg.passphrase="${{ secrets.MAVEN_GPG_PASSPHRASE }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
