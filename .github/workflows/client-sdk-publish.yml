name: Publish Java SDK to Maven Central

on:
  release:
    types: [ published, prereleased, released ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version for oc-java-client-sdk (e.g. 1.0.4)'
        type: string
        required: false
        default: '1.0.4'

permissions: read-all

jobs:
  publish-sdk:
    name: Build & Publish Java Client SDK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Resolve and Set Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VER="${TAG_NAME#v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VER="${TAG_NAME#v}"
          elif [ -n "${{ inputs.release_version }}" ]; then
            VER="${{ inputs.release_version }}"
            TAG_NAME="v${VER}"
          else
            VER="1.0.4"
            TAG_NAME="v1.0.4"
          fi
          if [ -n "$VER" ]; then
            echo "Setting oc-java-client-sdk release version to $VER"
            cd oc-java-client-sdk
            mvn versions:set -DnewVersion=$VER -DgenerateBackupPoms=false
            cd ..
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build Core Dependencies
        run: |
          mvn clean install -DskipTests -pl oc-core -am

      - name: Deploy Java Client SDK via Sonatype Central Publishing Plugin
        run: |
          cd oc-java-client-sdk
          mvn clean deploy -DskipTests \
            -Dgpg.skip=false \
            -Dgpg.passphrase="${{ secrets.MAVEN_GPG_PASSPHRASE }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Prepare Release SDK JAR
        run: |
          mkdir -p oc-java-client-sdk/target/release-jar
          BUILT_JAR=$(ls oc-java-client-sdk/target/oc-java-client-sdk-*.jar 2>/dev/null | grep -v 'sources' | grep -v 'javadoc' | grep -v 'original' | head -n 1)
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            cp "$BUILT_JAR" "oc-java-client-sdk/target/release-jar/oc-java-client-sdk-${{ steps.version.outputs.version }}.jar"
          else
            cp "$BUILT_JAR" "oc-java-client-sdk/target/release-jar/"
          fi

      - name: Upload SDK JAR Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: oc-java-client-sdk-jar
          path: oc-java-client-sdk/target/release-jar/oc-java-client-sdk-*.jar

      - name: Attach SDK JAR to GitHub Release
        if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && steps.version.outputs.tag_name != '')) && steps.version.outputs.tag_name != ''
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: oc-java-client-sdk/target/release-jar/oc-java-client-sdk-*.jar
