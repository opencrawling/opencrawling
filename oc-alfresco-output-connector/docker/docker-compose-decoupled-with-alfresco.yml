services:
  # --- Alfresco Content Services (Community Edition) ---
  alfresco:
    image: docker.io/alfresco/alfresco-content-repository-community:26.1.0
    container_name: alfresco-community-migration-target
    mem_limit: 2g
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres-alfresco:5432/alfresco
        -Dsolr.host=solr6
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=${ALFRESCO_INDEX_SUBSYSTEM:-noindex}
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 10s
      timeout: 3s
      retries: 25
      start_period: 30s
    volumes:
      - opencrawling-alfresco-target-data:/usr/local/tomcat/alf_data
    depends_on:
      postgres-alfresco:
        condition: service_healthy
      activemq:
        condition: service_healthy
      transform-core-aio:
        condition: service_healthy
    networks:
      - opencrawling-network

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.2
    container_name: transform-core-aio-migration
    mem_limit: 1536m
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      activemq:
        condition: service_healthy
    networks:
      - opencrawling-network

  postgres-alfresco:
    image: postgres:17.9
    container_name: postgres-alfresco-migration
    mem_limit: 512m
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - opencrawling-alfresco-target-pgdata:/var/lib/postgresql/data
    networks:
      - opencrawling-network

  activemq:
    image: docker.io/alfresco/alfresco-activemq:6.2.6-jre17-rockylinux8
    container_name: activemq-alfresco-migration
    mem_limit: 1g
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    ports:
      - "8161:8161"
      - "61616:61616"
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health", "|", "grep", "Good"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opencrawling-network

  # --- Alfresco Search Services (Solr6) - Optional via profile 'search' or 'solr' ---
  solr6:
    profiles:
      - search
      - solr
    image: docker.io/alfresco/alfresco-search-services:2.0.20
    container_name: solr6-alfresco-migration
    mem_limit: 2g
    environment:
      # Solr needs to know how to register itself with Alfresco
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      # Alfresco needs to know how to call solr
      SOLR_SOLR_HOST: "solr6"
      SOLR_SOLR_PORT: "8983"
      # Create the default alfresco and archive cores
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      # HTTPS or SECRET
      ALFRESCO_SECURE_COMMS: "secret"
      # SHARED SECRET VALUE
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=secret
    ports:
      - "8083:8983"
    volumes:
      - opencrawling-alfresco-target-solrdata:/opt/alfresco-search-services/data
    depends_on:
      alfresco:
        condition: service_healthy
    networks:
      - opencrawling-network

  # --- Infrastructure Services (Pipeline State & Decoupled Bus) ---
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector-decoupled-alfresco-output
    environment:
      POSTGRES_USER: opencrawling
      POSTGRES_PASSWORD: opencrawling_password
      POSTGRES_DB: opencrawling
    ports:
      - "5432:5432"
    volumes:
      - opencrawling-pgdata-alfresco-output:/var/lib/postgresql/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrawling"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack-decoupled-alfresco-output
    environment:
      REDIS_ARGS: "--requirepass redis_password"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - opencrawling-redisdata-alfresco-output:/data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-decoupled-alfresco-output
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9094,EXTERNAL://127.0.0.1:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9092:9092"
    volumes:
      - opencrawling-kafkadata-alfresco-output:/var/lib/kafka/data
    networks:
      - opencrawling-network

  # --- Claim Check Store (MinIO S3 Compatible Object Store) ---
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio-decoupled-alfresco-output
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - opencrawling-miniodata-alfresco-output:/minio_data
    networks:
      - opencrawling-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Decoupled OpenCrawling Services in Migration Mode ---
  oc-crawler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.crawler
    image: ghcr.io/opencrawling/oc-crawler:latest
    container_name: oc-crawler-service-alfresco-output
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - SPRING_OPENCRAWLING_CRAWLER_CONCURRENCY=${OC_CRAWLER_CONCURRENCY:-4}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - SPRING_OPENCRAWLING_CRAWL_ON_STARTUP=true
      - SPRING_OPENCRAWLING_SCAN_PATH=/crawl
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=alfresco
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-s3}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=S3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://minio:9000
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_REGION=us-east-1
      # Output Alfresco Configuration
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_URL=http://alfresco:8080/alfresco
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_USERNAME=admin
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_PASSWORD=admin
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_TARGET_PARENT_NODE_ID=-root-
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_TARGET_PATH_PREFIX=MigratedContent/v1
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_PATH_STRATEGY=HIERARCHICAL
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_NODE_TYPE=cm:content
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_CONFLICT_STRATEGY=OVERWRITE
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_SYNC_PERMISSIONS=true
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_DEFAULT_PERMISSION_ROLE=Consumer
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_TOMBSTONE_ACTION=MOVE_TO_TRASH
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
      - OPENCRAWLING_MCP_SERVER_ENABLED=false
      - OPENCRAWLING_TIKA_FORK_ENABLED=false
      - SPRING_OPENCRAWLING_REPORTING_LOCAL_DIR=/data/reports
    volumes:
      - ../../oc-runtime/data:/data
      - ${OC_CRAWL_SOURCE_DIR:-../../oc-runtime/crawl-data/alfresco-migration}:/crawl
      - opencrawling-reportsdata-alfresco-output:/data/reports
    depends_on:
      - kafka
      - redis
      - minio
      - alfresco
    networks:
      - opencrawling-network
    restart: "no"

  oc-ingestion-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.ingestion-consumer
    image: ghcr.io/opencrawling/oc-ingestion-consumer:latest
    container_name: oc-ingestion-consumer-service-alfresco-output
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=alfresco
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-s3}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=S3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://minio:9000
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_REGION=us-east-1
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=true
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=false
    volumes:
      - ../../oc-runtime/data:/data
    depends_on:
      - kafka
      - redis
    networks:
      - opencrawling-network
    restart: unless-stopped

  oc-writer-consumer:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.writer-consumer
    image: ghcr.io/opencrawling/oc-writer-consumer:latest
    container_name: oc-writer-service-alfresco-output
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPRING_OPENCRAWLING_KAFKA_TOPIC_PARTITIONS=${OC_KAFKA_PARTITIONS:-3}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redis_password
      - OPENCRAWLING_PIPELINE_MODE=migration
      - SPRING_OPENCRAWLING_OUTPUT_TYPE=alfresco
      # Target Alfresco Content Services Configuration
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_URL=http://alfresco:8080/alfresco
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_USERNAME=admin
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_PASSWORD=admin
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_TARGET_PARENT_NODE_ID=-root-
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_TARGET_PATH_PREFIX=MigratedContent/v1
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_PATH_STRATEGY=HIERARCHICAL
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_NODE_TYPE=cm:content
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_CONFLICT_STRATEGY=OVERWRITE
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_SYNC_PERMISSIONS=true
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_DEFAULT_PERMISSION_ROLE=Consumer
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_TOMBSTONE_ACTION=MOVE_TO_TRASH
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_CONSUMER_GROUP=opencrawling-alfresco-migration-group
      - SPRING_OPENCRAWLING_OUTPUT_ALFRESCO_PARALLELISM=${ALFRESCO_WRITER_PARALLELISM:-4}
      # Claim Check store configuration (MinIO S3)
      - SPRING_OPENCRAWLING_CLAIM_CHECK_STORE=${SPRING_OPENCRAWLING_CLAIM_CHECK_STORE:-s3}
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_CLIENT_TYPE=S3
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_S3_ENDPOINT=http://minio:9000
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_BUCKET=claims
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_ACCESS_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_SECRET_KEY=minioadmin
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_PATH_STYLE_ACCESS=true
      - SPRING_OPENCRAWLING_CLAIM_CHECK_OZONE_REGION=us-east-1
      - OPENCRAWLING_CONSUMER_WRITER_ENABLED=true
      - OPENCRAWLING_CONSUMER_INGESTION_ENABLED=false
      - OPENCRAWLING_CONSUMER_EMBEDDING_ENABLED=false
    volumes:
      - ../../oc-runtime/data:/data
    depends_on:
      - kafka
      - redis
      - minio
      - alfresco
    networks:
      - opencrawling-network
    restart: unless-stopped

volumes:
  opencrawling-alfresco-target-data:
  opencrawling-alfresco-target-pgdata:
  opencrawling-alfresco-target-solrdata:
  opencrawling-pgdata-alfresco-output:
  opencrawling-redisdata-alfresco-output:
  opencrawling-kafkadata-alfresco-output:
  opencrawling-miniodata-alfresco-output:
  opencrawling-reportsdata-alfresco-output:

networks:
  opencrawling-network:
    driver: bridge
